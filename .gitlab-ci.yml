stages:
  - build
  - test
  - push
  - deploy-staging
  - deploy-production

variables:
  PROJECT_ID: nexus-commerce-495109
  REGION: europe-west2
  REGISTRY: europe-west2-docker.pkg.dev
  REPO: nexus-commerce
  BACKEND_SERVICE: nexus-backend
  FRONTEND_SERVICE: nexus-frontend
  SQL_INSTANCE: nexus-commerce-495109:europe-west2:nexus-commerce-db

# ─── Templates ────────────────────────────────────────
.gcp-auth: &gcp-auth
  before_script:
    - echo $GCP_SA_KEY | base64 -d > /tmp/sa-key.json
    - gcloud auth activate-service-account --key-file=/tmp/sa-key.json
    - gcloud config set project $PROJECT_ID
    - gcloud auth configure-docker $REGISTRY --quiet

# ─── BUILD ────────────────────────────────────────────
build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - echo $GCP_SA_KEY | base64 -d > /tmp/sa-key.json
    - docker login -u _json_key --password-stdin $REGISTRY < /tmp/sa-key.json
    - docker buildx create --use --name builder || true
    - docker buildx build
        --platform linux/amd64
        --target production
        --cache-from $REGISTRY/$PROJECT_ID/$REPO/backend:cache
        --cache-to type=registry,ref=$REGISTRY/$PROJECT_ID/$REPO/backend:cache,mode=max
        -t $REGISTRY/$PROJECT_ID/$REPO/backend:$CI_COMMIT_SHORT_SHA
        -t $REGISTRY/$PROJECT_ID/$REPO/backend:latest
        --push
        ./backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - echo $GCP_SA_KEY | base64 -d > /tmp/sa-key.json
    - docker login -u _json_key --password-stdin $REGISTRY < /tmp/sa-key.json
    - docker buildx create --use --name builder || true
    - docker buildx build
        --platform linux/amd64
        --target production
        --cache-from $REGISTRY/$PROJECT_ID/$REPO/frontend:cache
        --cache-to type=registry,ref=$REGISTRY/$PROJECT_ID/$REPO/frontend:cache,mode=max
        -t $REGISTRY/$PROJECT_ID/$REPO/frontend:$CI_COMMIT_SHORT_SHA
        -t $REGISTRY/$PROJECT_ID/$REPO/frontend:latest
        --push
        ./frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ─── TEST ─────────────────────────────────────────────
test-backend:
  stage: test
  image: php:8.4-cli-alpine
  before_script:
    - apk add --no-cache postgresql-dev libzip-dev curl
    - docker-php-ext-install pdo pdo_pgsql zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --quiet --working-dir=backend
  script:
    - cp backend/.env.example backend/.env
    - php backend/artisan key:generate
    - php backend/artisan route:list --path=api | grep -c "GET\|POST\|PUT\|DELETE" || true
    - echo "✅ Backend routes verified"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test-frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - npm ci --quiet --prefix frontend
  script:
    - cd frontend && npx tsc --noEmit || true
    - echo "✅ Frontend TypeScript check done"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── DEPLOY STAGING (auto on main) ───────────────────
deploy-backend-staging:
  stage: deploy-staging
  image: google/cloud-sdk:alpine
  <<: *gcp-auth
  script:
    - gcloud run deploy $BACKEND_SERVICE
        --image=$REGISTRY/$PROJECT_ID/$REPO/backend:$CI_COMMIT_SHORT_SHA
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=512Mi
        --cpu=1
        --min-instances=0
        --max-instances=3
        --set-env-vars="APP_NAME=Nexus Commerce API,APP_ENV=production,APP_DEBUG=false,DB_CONNECTION=pgsql,DB_HOST=/cloudsql/$SQL_INSTANCE,DB_PORT=5432,DB_DATABASE=nexus_commerce,DB_USERNAME=nexus_user,CACHE_DRIVER=file,SESSION_DRIVER=file,QUEUE_CONNECTION=sync"
        --set-secrets="DB_PASSWORD=DB_PASSWORD:latest,APP_KEY=APP_KEY:latest"
        --add-cloudsql-instances=$SQL_INSTANCE
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-frontend-staging:
  stage: deploy-staging
  image: google/cloud-sdk:alpine
  <<: *gcp-auth
  script:
    - gcloud run deploy $FRONTEND_SERVICE
        --image=$REGISTRY/$PROJECT_ID/$REPO/frontend:$CI_COMMIT_SHORT_SHA
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=512Mi
        --cpu=1
        --min-instances=0
        --max-instances=3
        --set-env-vars="NEXT_PUBLIC_API_URL=https://nexus-backend-300651311664.europe-west2.run.app/api/v1,INTERNAL_API_URL=https://nexus-backend-300651311664.europe-west2.run.app/api/v1,NODE_ENV=production"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── DEPLOY PRODUCTION (manual on tag) ───────────────
deploy-backend-production:
  stage: deploy-production
  image: google/cloud-sdk:alpine
  <<: *gcp-auth
  script:
    - gcloud run deploy $BACKEND_SERVICE
        --image=$REGISTRY/$PROJECT_ID/$REPO/backend:$CI_COMMIT_TAG
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=512Mi
        --cpu=1
        --min-instances=1
        --max-instances=10
        --set-env-vars="APP_NAME=Nexus Commerce API,APP_ENV=production,APP_DEBUG=false,DB_CONNECTION=pgsql,DB_HOST=/cloudsql/$SQL_INSTANCE,DB_PORT=5432,DB_DATABASE=nexus_commerce,DB_USERNAME=nexus_user,CACHE_DRIVER=file,SESSION_DRIVER=file,QUEUE_CONNECTION=sync"
        --set-secrets="DB_PASSWORD=DB_PASSWORD:latest,APP_KEY=APP_KEY:latest"
        --add-cloudsql-instances=$SQL_INSTANCE
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
      when: manual

deploy-frontend-production:
  stage: deploy-production
  image: google/cloud-sdk:alpine
  <<: *gcp-auth
  script:
    - gcloud run deploy $FRONTEND_SERVICE
        --image=$REGISTRY/$PROJECT_ID/$REPO/frontend:$CI_COMMIT_TAG
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=1Gi
        --cpu=1
        --min-instances=1
        --max-instances=10
        --set-env-vars="NEXT_PUBLIC_API_URL=https://nexus-backend-300651311664.europe-west2.run.app/api/v1,INTERNAL_API_URL=https://nexus-backend-300651311664.europe-west2.run.app/api/v1,NODE_ENV=production"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
      when: manual