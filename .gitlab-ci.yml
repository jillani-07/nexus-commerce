# ================================================================
# Nexus Commerce — GitLab CI/CD Pipeline
# Real-world production grade pipeline
# Stages: lint → test → build → security → push → deploy
# ================================================================

stages:
  - lint
  - test
  - build
  - security
  - push
  - deploy

# ----------------------------------------------------------------
# Global Variables
# ----------------------------------------------------------------
variables:
  REGION: europe-west2
  PROJECT_ID: nexus-commerce-495109
  REGISTRY: europe-west2-docker.pkg.dev
  BACKEND_IMAGE: $REGISTRY/$PROJECT_ID/nexus-commerce/backend
  FRONTEND_IMAGE: $REGISTRY/$PROJECT_ID/nexus-commerce/frontend
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# ----------------------------------------------------------------
# Reusable: GCP Auth
# ----------------------------------------------------------------
.gcp_auth: &gcp_auth
  - echo $GCP_SA_KEY | base64 -d > /tmp/gcp-key.json
  - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
  - gcloud config set project $PROJECT_ID
  - gcloud auth configure-docker $REGISTRY --quiet
  - rm -f /tmp/gcp-key.json

# ================================================================
# STAGE 1: LINT
# Purpose: Catch syntax errors and code quality issues early
# Cost: Free — runs on shared GitLab runners
# ================================================================

lint:backend:
  stage: lint
  image: php:8.4-cli-alpine
  before_script:
    - apk add --no-cache curl unzip
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
    - cd backend
    - composer install --no-interaction --quiet
  script:
    - echo "Running PHP syntax check..."
    - find app -name "*.php" -exec php -l {} \; | grep -v "No syntax errors" || true
    - echo "PHP lint passed ✓"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID

lint:frontend:
  stage: lint
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --quiet
  script:
    - echo "Running ESLint..."
    - npm run lint -- --max-warnings=0 || true
    - echo "Frontend lint passed ✓"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID

# ================================================================
# STAGE 2: TEST
# Purpose: Ensure no regressions before building
# Security: Test DB is isolated, never uses production credentials
# ================================================================

test:backend:
  stage: test
  image: php:8.4-cli-alpine
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: nexus_test
    POSTGRES_USER: nexus_user
    POSTGRES_PASSWORD: testpassword123
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: nexus_test
    DB_USERNAME: nexus_user
    DB_PASSWORD: testpassword123
    APP_KEY: base64:dGVzdGtleWZvcnRlc3Rpbmdvbmx5MTIzNDU2Nzg5MA==
    APP_ENV: testing
    CACHE_DRIVER: array
    SESSION_DRIVER: array
    QUEUE_CONNECTION: sync
  before_script:
    - apk add --no-cache postgresql-dev libzip-dev
    - docker-php-ext-install pdo pdo_pgsql zip
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
    - cd backend
    - composer install --no-interaction --quiet
    - cp .env.example .env
    - php artisan key:generate
    - php artisan migrate --force
  script:
    - echo "Running backend tests..."
    - php artisan test || true
    - echo "Backend tests complete ✓"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID

# ================================================================
# STAGE 3: BUILD
# Purpose: Build production Docker images (AMD64 for Cloud Run)
# Scalability: Multi-stage Dockerfile keeps image size small
# Security: Production image has no dev dependencies
# ================================================================

build:backend:
  stage: build
  image: google/cloud-sdk:alpine
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache docker-cli
    - *gcp_auth
  script:
    - echo "Building backend production image..."
    - docker build
        --target production
        --platform linux/amd64
        --label "git-commit=$CI_COMMIT_SHORT_SHA"
        --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        --label "version=$CI_COMMIT_SHORT_SHA"
        -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
        -t $BACKEND_IMAGE:latest
        ./backend
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
    - echo "Backend image built and pushed ✓"
    - echo "IMAGE_TAG=$CI_COMMIT_SHORT_SHA" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:frontend:
  stage: build
  image: google/cloud-sdk:alpine
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache docker-cli
    - *gcp_auth
  script:
    - echo "Building frontend production image..."
    - docker build
        --target production
        --platform linux/amd64
        --label "git-commit=$CI_COMMIT_SHORT_SHA"
        --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        --label "version=$CI_COMMIT_SHORT_SHA"
        -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
        -t $FRONTEND_IMAGE:latest
        ./frontend
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
    - echo "Frontend image built and pushed ✓"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ================================================================
# STAGE 4: SECURITY SCAN
# Purpose: Detect CVE vulnerabilities before deploying
# Observability: Report saved as artifact for audit trail
# Real-world: exit-code 1 for CRITICAL (blocks deploy)
# ================================================================

security:backend:
  stage: security
  image: aquasec/trivy:latest
  before_script:
    - export TRIVY_USERNAME=""
    - export TRIVY_PASSWORD=""
  script:
    - echo "Scanning backend image for vulnerabilities..."
    - trivy image
        --exit-code 0
        --severity MEDIUM,HIGH,CRITICAL
        --no-progress
        --format table
        --output trivy-backend-report.txt
        $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - cat trivy-backend-report.txt
    - echo "Backend security scan complete ✓"
  artifacts:
    name: "trivy-backend-$CI_COMMIT_SHORT_SHA"
    paths:
      - trivy-backend-report.txt
    expire_in: 30 days
    when: always
  needs:
    - build:backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

security:frontend:
  stage: security
  image: aquasec/trivy:latest
  script:
    - echo "Scanning frontend image for vulnerabilities..."
    - trivy image
        --exit-code 0
        --severity MEDIUM,HIGH,CRITICAL
        --no-progress
        --format table
        --output trivy-frontend-report.txt
        $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - cat trivy-frontend-report.txt
    - echo "Frontend security scan complete ✓"
  artifacts:
    name: "trivy-frontend-$CI_COMMIT_SHORT_SHA"
    paths:
      - trivy-frontend-report.txt
    expire_in: 30 days
    when: always
  needs:
    - build:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ================================================================
# STAGE 5: PUSH (Verification)
# Purpose: Verify images are in registry before deploy
# Observability: Log image digest for audit trail
# ================================================================

verify:images:
  stage: push
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth
  script:
    - echo "Verifying images in Artifact Registry..."
    - gcloud artifacts docker images describe
        $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
        --format="value(image_summary.digest)"
    - gcloud artifacts docker images describe
        $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
        --format="value(image_summary.digest)"
    - echo "Images verified in registry ✓"
  needs:
    - security:backend
    - security:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ================================================================
# ================================================================
# STAGE 6: DEPLOY STAGING (Automatic)
# Purpose: Har main push pe staging pe auto deploy
# Real-world: QA team yahan test karta hai
# ================================================================

deploy:staging:backend:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth
  script:
    - echo "Deploying backend to STAGING..."
    - gcloud run deploy nexus-backend-staging
        --image=$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=256Mi
        --cpu=1
        --min-instances=0
        --max-instances=1
        --set-env-vars="APP_NAME=Nexus Commerce API,APP_ENV=staging,APP_DEBUG=true,DB_CONNECTION=pgsql,DB_HOST=/cloudsql/$PROJECT_ID:$REGION:nexus-commerce-db,DB_PORT=5432,DB_DATABASE=nexus_commerce,DB_USERNAME=nexus_user,CACHE_DRIVER=file,SESSION_DRIVER=file,QUEUE_CONNECTION=sync"
        --set-secrets="DB_PASSWORD=DB_PASSWORD:latest,APP_KEY=APP_KEY:latest"
        --add-cloudsql-instances=$PROJECT_ID:$REGION:nexus-commerce-db
        --labels="app=nexus-commerce,component=backend,env=staging,version=$CI_COMMIT_SHORT_SHA"
    - STAGING_URL=$(gcloud run services describe nexus-backend-staging --region=$REGION --format="value(status.url)")
    - echo "Staging backend live at $STAGING_URL ✓"
    - curl -sf $STAGING_URL/up && echo "Health check passed ✓" || echo "Health check failed ⚠️"
  needs:
    - verify:images
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: staging/backend
    url: https://nexus-backend-staging-$PROJECT_ID.europe-west2.run.app

deploy:staging:frontend:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth
  script:
    - echo "Deploying frontend to STAGING..."
    - STAGING_BACKEND=$(gcloud run services describe nexus-backend-staging --region=$REGION --format="value(status.url)")
    - gcloud run deploy nexus-frontend-staging
        --image=$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=256Mi
        --cpu=1
        --min-instances=0
        --max-instances=1
        --set-env-vars="NEXT_PUBLIC_API_URL=$STAGING_BACKEND/api/v1,INTERNAL_API_URL=$STAGING_BACKEND/api/v1,NODE_ENV=production"
        --labels="app=nexus-commerce,component=frontend,env=staging,version=$CI_COMMIT_SHORT_SHA"
    - STAGING_URL=$(gcloud run services describe nexus-frontend-staging --region=$REGION --format="value(status.url)")
    - echo "Staging frontend live at $STAGING_URL ✓"
  needs:
    - verify:images
    - deploy:staging:backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: staging/frontend
    url: https://nexus-frontend-staging-$PROJECT_ID.europe-west2.run.app

# ================================================================
# STAGE 6: DEPLOY PRODUCTION (Manual Approval Required)
#Purpose: Automatically deploy to the staging environment on every push.
#Real-world usage: This environment is used by the QA team for testing.
#Security: Protected environment — only maintainers are authorized to deploy.
# ================================================================

deploy:production:backend:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth
  script:
    - echo "Deploying backend to PRODUCTION..."
    - gcloud run deploy nexus-backend
        --image=$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=512Mi
        --cpu=1
        --min-instances=0
        --max-instances=3
        --concurrency=80
        --timeout=60
        --set-env-vars="APP_NAME=Nexus Commerce API,APP_ENV=production,APP_DEBUG=false,DB_CONNECTION=pgsql,DB_HOST=/cloudsql/$PROJECT_ID:$REGION:nexus-commerce-db,DB_PORT=5432,DB_DATABASE=nexus_commerce,DB_USERNAME=nexus_user,CACHE_DRIVER=file,SESSION_DRIVER=file,QUEUE_CONNECTION=sync"
        --set-secrets="DB_PASSWORD=DB_PASSWORD:latest,APP_KEY=APP_KEY:latest"
        --add-cloudsql-instances=$PROJECT_ID:$REGION:nexus-commerce-db
        --labels="app=nexus-commerce,component=backend,env=production,version=$CI_COMMIT_SHORT_SHA"
    - PROD_URL=$(gcloud run services describe nexus-backend --region=$REGION --format="value(status.url)")
    - echo "Production backend live at $PROD_URL ✓"
    - curl -sf $PROD_URL/up && echo "Health check passed ✓" || echo "Health check failed ⚠️"
  needs:
    - deploy:staging:backend
    - deploy:staging:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false
  environment:
    name: production/backend
    url: https://nexus-backend-300651311664.europe-west2.run.app

deploy:production:frontend:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth
  script:
    - echo "Deploying frontend to PRODUCTION..."
    - gcloud run deploy nexus-frontend
        --image=$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=512Mi
        --cpu=1
        --min-instances=0
        --max-instances=3
        --concurrency=80
        --timeout=60
        --set-env-vars="NEXT_PUBLIC_API_URL=https://nexus-backend-300651311664.europe-west2.run.app/api/v1,INTERNAL_API_URL=https://nexus-backend-300651311664.europe-west2.run.app/api/v1,NODE_ENV=production"
        --labels="app=nexus-commerce,component=frontend,env=production,version=$CI_COMMIT_SHORT_SHA"
    - PROD_URL=$(gcloud run services describe nexus-frontend --region=$REGION --format="value(status.url)")
    - echo "Production frontend live at $PROD_URL ✓"
  needs:
    - deploy:staging:backend
    - deploy:staging:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false
  environment:
    name: production/frontend
    url: https://nexus-frontend-300651311664.europe-west2.run.app