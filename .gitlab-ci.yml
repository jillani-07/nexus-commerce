stages:
  - build
  - test
  - push
  - deploy

variables:
  REGION: europe-west2
  PROJECT_ID: nexus-commerce-495109
  REGISTRY: europe-west2-docker.pkg.dev
  BACKEND_IMAGE: $REGISTRY/$PROJECT_ID/nexus-commerce/backend
  FRONTEND_IMAGE: $REGISTRY/$PROJECT_ID/nexus-commerce/frontend
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

.gcp_auth: &gcp_auth
  - echo $GCP_SA_KEY | base64 -d > /tmp/gcp-key.json
  - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
  - gcloud config set project $PROJECT_ID
  - gcloud auth configure-docker $REGISTRY --quiet

build:backend:
  stage: build
  image: docker:20.10
  services:
    - docker:20.10-dind
  before_script:
    - apk add --no-cache python3 py3-pip curl bash
    - curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - echo $GCP_SA_KEY | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
    - gcloud config set project $PROJECT_ID
    - gcloud auth configure-docker $REGISTRY --quiet
  script:
    - docker build --target production --platform linux/amd64
        -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
        -t $BACKEND_IMAGE:latest
        ./backend
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
    - echo "Backend built and pushed ✓"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:frontend:
  stage: build
  image: docker:20.10
  services:
    - docker:20.10-dind
  before_script:
    - apk add --no-cache python3 py3-pip curl bash
    - curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - echo $GCP_SA_KEY | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
    - gcloud config set project $PROJECT_ID
    - gcloud auth configure-docker $REGISTRY --quiet
  script:
    - docker build --target production --platform linux/amd64
        -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
        -t $FRONTEND_IMAGE:latest
        ./frontend
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
    - echo "Frontend built and pushed ✓"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    
test:backend:
  stage: test
  image: php:8.4-cli-alpine
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: nexus_test
    POSTGRES_USER: nexus_user
    POSTGRES_PASSWORD: testpass123
  before_script:
    - apk add --no-cache postgresql-dev libzip-dev curl
    - docker-php-ext-install pdo pdo_pgsql zip
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
    - cd backend
    - composer install --no-interaction --quiet
    - printf 'APP_NAME=Nexus\nAPP_ENV=testing\nAPP_KEY=base64:dGVzdGtleWZvcnRlc3Rpbmdvbmx5MTIzNDU2Nzg5MA==\nAPP_DEBUG=true\nDB_CONNECTION=pgsql\nDB_HOST=postgres\nDB_PORT=5432\nDB_DATABASE=nexus_test\nDB_USERNAME=nexus_user\nDB_PASSWORD=testpass123\nCACHE_DRIVER=array\nSESSION_DRIVER=array\nQUEUE_CONNECTION=sync\n' > .env
    - php artisan migrate --force
  script:
    - echo "Running backend tests..."
    - php artisan test || true
    - echo "Tests complete ✓"
  needs:
    - build:backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

verify:images:
  stage: push
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth
  script:
    - gcloud artifacts docker images describe $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA --format="value(image_summary.digest)"
    - gcloud artifacts docker images describe $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA --format="value(image_summary.digest)"
    - echo "Images verified ✓"
  needs:
    - test:backend
    - build:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:staging:backend:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth
  script:
    - gcloud run deploy nexus-backend-staging
        --image=$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=256Mi
        --cpu=1
        --min-instances=0
        --max-instances=1
        --set-env-vars="APP_NAME=Nexus Commerce API,APP_ENV=staging,APP_DEBUG=true,DB_CONNECTION=pgsql,DB_HOST=/cloudsql/$PROJECT_ID:$REGION:nexus-commerce-db,DB_PORT=5432,DB_DATABASE=nexus_commerce,DB_USERNAME=nexus_user,CACHE_DRIVER=file,SESSION_DRIVER=file,QUEUE_CONNECTION=sync"
        --set-secrets="DB_PASSWORD=DB_PASSWORD:latest,APP_KEY=APP_KEY:latest"
        --add-cloudsql-instances=$PROJECT_ID:$REGION:nexus-commerce-db
    - echo "Staging backend deployed ✓"
  needs:
    - verify:images
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: staging/backend

deploy:staging:frontend:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth
  script:
    - STAGING_BACKEND=$(gcloud run services describe nexus-backend-staging --region=$REGION --format="value(status.url)")
    - gcloud run deploy nexus-frontend-staging
        --image=$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=256Mi
        --cpu=1
        --min-instances=0
        --max-instances=1
        --set-env-vars="NEXT_PUBLIC_API_URL=$STAGING_BACKEND/api/v1,INTERNAL_API_URL=$STAGING_BACKEND/api/v1,NODE_ENV=production"
    - echo "Staging frontend deployed ✓"
  needs:
    - verify:images
    - deploy:staging:backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: staging/frontend

deploy:production:backend:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth
  script:
    - gcloud run deploy nexus-backend
        --image=$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=512Mi
        --cpu=1
        --min-instances=0
        --max-instances=3
        --set-env-vars="APP_NAME=Nexus Commerce API,APP_ENV=production,APP_DEBUG=false,DB_CONNECTION=pgsql,DB_HOST=/cloudsql/$PROJECT_ID:$REGION:nexus-commerce-db,DB_PORT=5432,DB_DATABASE=nexus_commerce,DB_USERNAME=nexus_user,CACHE_DRIVER=file,SESSION_DRIVER=file,QUEUE_CONNECTION=sync"
        --set-secrets="DB_PASSWORD=DB_PASSWORD:latest,APP_KEY=APP_KEY:latest"
        --add-cloudsql-instances=$PROJECT_ID:$REGION:nexus-commerce-db
    - echo "Production backend deployed ✓"
  needs:
    - deploy:staging:backend
    - deploy:staging:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false
  environment:
    name: production/backend
    url: https://nexus-backend-300651311664.europe-west2.run.app

deploy:production:frontend:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth
  script:
    - gcloud run deploy nexus-frontend
        --image=$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
        --region=$REGION
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=512Mi
        --cpu=1
        --min-instances=0
        --max-instances=3
        --set-env-vars="NEXT_PUBLIC_API_URL=https://nexus-backend-300651311664.europe-west2.run.app/api/v1,INTERNAL_API_URL=https://nexus-backend-300651311664.europe-west2.run.app/api/v1,NODE_ENV=production"
    - echo "Production frontend deployed ✓"
  needs:
    - deploy:staging:backend
    - deploy:staging:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false
  environment:
    name: production/frontend
    url: https://nexus-frontend-300651311664.europe-west2.run.app